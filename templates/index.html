<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>H1B Case Outcome Predictor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>H1B Case Outcome Predictor</h1>

            <p class="subtitle">
                Machine Learning Based Case Outcome Prediction
            </p>

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <form action="/predict" method="POST">

                <div class="form-group">
                    <label>Employer Name</label>
                    <input
                        type="text"
                        name="employer_name"
                        placeholder="Example: Microsoft Corporation"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Occupation / SOC Name</label>
                    <input
                        type="text"
                        name="soc_name"
                        placeholder="Example: Software Developers"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Job Title</label>
                    <input
                        type="text"
                        name="job_title"
                        placeholder="Example: Software Developer"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Full-Time Position</label>

                    <select name="full_time_position" required>
                        <option value="">Select</option>
                        <option value="Y">Yes</option>
                        <option value="N">No</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Prevailing Wage ($)</label>
                    <input
                        type="number"
                        name="prevailing_wage"
                        placeholder="Example: 100000"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Year</label>

                    <select name="year" required>
                        <option value="">Select Year</option>
                        <option value="2011">2011</option>
                        <option value="2012">2012</option>
                        <option value="2013">2013</option>
                        <option value="2014">2014</option>
                        <option value="2015">2015</option>
                        <option value="2016">2016</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Worksite</label>
                    <input
                        type="text"
                        name="worksite"
                        placeholder="Example: Seattle, Washington"
                        required
                    >
                </div>

                <button type="submit">
                    Predict Case Outcome
                </button>

            </form>


            {% if result %}

                <div class="result">

                    <h2>Prediction Result</h2>

                    <div class="result-box">
                        <h3>{{ result }}</h3>
                    </div>

                    <div class="probabilities">

                        <div>
                            <span>Class 0 Probability</span>
                            <strong>{{ class_0_probability }}%</strong>
                        </div>

                        <div>
                            <span>Class 1 Probability</span>
                            <strong>{{ class_1_probability }}%</strong>
                        </div>

                    </div>

                </div>

            {% endif %}

        </div>

    </div>

</body>
</html>
